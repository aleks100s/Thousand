<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Thousand Dice Scene</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#304820}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #wooden-frame{position:absolute;inset:0;pointer-events:none}
    #roll-result{position:absolute;transform:translateX(-50%);width:76%;text-align:center;pointer-events:none;color:#f2f7ed;font-family:system-ui,-apple-system,sans-serif;text-shadow:0 2px 8px rgba(0,0,0,.5)}
    #roll-score{font-size:30px;font-weight:650;line-height:1.2;letter-spacing:-.5px}
    #roll-prompt{margin-top:7px;font-size:14px;line-height:1.4;color:#d1ddc7}
  </style>
</head>
<body>
  <canvas aria-label="Игровые кубики"></canvas>
  <div id="roll-result" hidden><div id="roll-score"></div><div id="roll-prompt">продолжить или сохранить?</div></div>
  <canvas id="wooden-frame" aria-hidden="true"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
